<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            box-sizing:border-box;
        }
        html,body{
            width:100%;
            height:100%;
        }
        #main{
            padding: 10px;
            width:100%;
            height:100%;
            background-color: #535353;
        }
        #btn{
            color:white;
            background-color: rgba(51, 143, 51, 0.568);
            padding: 6px 9px;
            border-radius: 4px;
        }
        input{
            display:block;
            margin:5px 5px;
            color:white;
            background-color: #212020;
        }
        .card{
            padding:20px;
            margin-top: 20px;
            max-width: 400px;
            border: 2px solid rgb(59, 58, 58);
            border-radius: 5px;  
            color:rgb(4, 4, 4);  
            background-color: rgb(228, 236, 249);        
        }  
        .profile{
            width:50px;
            height:50px;
            border-radius:50px;
            margin-bottom: 6px;
            background-color: yellow;
            overflow: hidden;
        }  
        .card h3{
            margin-bottom: 3px;            
            font-weight: bolder;
        }
        .card h4{
            margin-bottom: 8px;
        }
        .card p{
            font-size: 15px;
        }
        img{
            width:100%;
        }
    </style>
</head>
<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="profile pic">
            <input type="text" placeholder="name">
            <input type="text" placeholder="occupation">
            <input type="text" placeholder="bio">
            <input type="submit" id="btn" >

        </form>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
