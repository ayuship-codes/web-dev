<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            box-sizing:border-box;
        }
        html,body{
            width:100%;
            height:100%;
        }
        #main{
            display:flex;
            align-items: center;
            justify-content: center;
            width:100%;
            height:100%;
            background-color: #2e2d2d;
        }
        input{
            display:none;
        }
        #btn{
            color:white;
            background-color: rgba(51, 143, 51, 0.568);
            padding: 6px 9px;
            border-radius: 4px;
        }
        #btn:hover{
            background-color: rgba(9, 118, 9, 0.492);
        }
    </style>
</head>
<body>
    <div id="main">
        <input id="input" type="file">
        <div id="btn"> Upload file</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
